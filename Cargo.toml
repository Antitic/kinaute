[workspace]
resolver = "2"
members = ["crates/xml", "crates/model", "crates/pptx", "crates/render", "crates/tool", "crates/app"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/antitic/kinaute"
rust-version = "1.85"

[workspace.dependencies]
kinaute-xml = { path = "crates/xml" }
kinaute-model = { path = "crates/model" }
kinaute-pptx = { path = "crates/pptx" }
kinaute-render = { path = "crates/render" }
quick-xml = "0.42"
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tiny-skia = "0.12"
cosmic-text = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
